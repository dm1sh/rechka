name: Build release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APKs (light + full)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Install release signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          chmod 600 release.keystore keystore.properties

      # The native runtime is intentionally gitignored because it is a large AAR.
      - name: Download sherpa-onnx runtime
        run: ./scripts/download-sherpa-onnx.sh

      - name: Build native FFmpeg resampler
        run: ./scripts/build-ffmpeg-swresample.sh

      # Only the full APK packages the model; the script SHA-256-verifies it.
      - name: Download GigaAM model for the full APK
        run: bash scripts/download-model.sh

      # Both variants are built in one invocation with one versionCode and
      # one signing key, so users can replace one APK with the other without
      # losing app data (including the installed model).
      - name: Build signed light and full release APKs
        env:
          # Keep release builds monotonically versioned for upgrade installs.
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleLightRelease assembleFullRelease \
            -PversionCode="$VERSION_CODE"

      - name: Package and verify release APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/light/release/app-light-release.apk dist/rechka-light.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk dist/rechka-full.apk

          # The full APK must contain the model; the light APK must not.
          for file in \
            gigaam_v3_e2e_rnnt_encoder_int8.onnx \
            gigaam_v3_e2e_rnnt_decoder.onnx \
            gigaam_v3_e2e_rnnt_joint.onnx \
            gigaam_v3_e2e_rnnt_tokens.txt; do
            unzip -l dist/rechka-full.apk | grep -q "assets/$file" \
              || { echo "Full APK is missing assets/$file"; exit 1; }
            if unzip -l dist/rechka-light.apk | grep -q "assets/$file"; then
              echo "Light APK must not contain assets/$file"; exit 1
            fi
          done

          # Identical application id/versionCode/signing is what lets either
          # APK replace the other; fail the release if they ever diverge.
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -n 1)"
          light_id="$("$AAPT" dump badging dist/rechka-light.apk | grep -E '^package:')"
          full_id="$("$AAPT" dump badging dist/rechka-full.apk | grep -E '^package:')"
          echo "light: $light_id"
          echo "full:  $full_id"
          [ "$light_id" = "$full_id" ] || { echo "APK package/version mismatch"; exit 1; }
          ls -la dist
          (cd dist && sha256sum rechka-light.apk rechka-full.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: rechka-release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload release mappings
        uses: actions/upload-artifact@v4
        with:
          name: rechka-release-mapping
          path: |
            app/build/outputs/mapping/lightRelease/mapping.txt
            app/build/outputs/mapping/fullRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub release and attach APKs
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$MANUAL_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG"; exit 1 ;;
          esac

          gh release create "$RELEASE_TAG" \
            dist/rechka-light.apk \
            dist/rechka-full.apk \
            dist/SHA256SUMS.txt \
            --title "$RELEASE_TAG" \
            --generate-notes
